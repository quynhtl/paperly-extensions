name: Check listing

# Runs on pull requests that touch listings, including ones from forks, and
# merges those that pass (see scripts/lib/review.mjs).
#
# pull_request_target gives this job a token that can write to the repository,
# so it must never run code from the pull request. It checks out the default
# branch, and scripts/review-pr.mjs reads the pull request's listings through
# the API as plain JSON.
on:
  pull_request_target:
    # ready_for_review: a draft is checked but not merged, so it is checked
    # again once it is ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["extensions/**"]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: listing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The default branch as it is now. The pull request's base.sha is where
      # its branch started, and moves only if the branch is updated from it:
      # checked out, a fix to the checks would not apply to pull requests
      # opened before it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The review covers the commit this event names and nothing else: a push
      # that touches no listing starts no new run, so without the pin a commit
      # pushed while the check runs would be merged unchecked.
      - id: review
        run: node scripts/review-pr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      # --match-head-commit makes GitHub refuse the merge if the pull request
      # has moved on from the commit that was checked. A merge made with
      # GITHUB_TOKEN starts no workflows of its own, so the publish run is
      # asked for explicitly.
      - if: steps.review.outputs.merge == 'true'
        run: |
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$SHA" --repo "$GITHUB_REPOSITORY"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.review.outputs.sha }}
