name: Publish

# Builds the marketplace from every listing's GitHub releases, signs it, and
# deploys it to GitHub Pages. Runs when main changes, every three hours to pick
# up new releases, and on request.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # The build asks GitHub with a token of its own, PUBLISH_GITHUB_TOKEN,
      # when there is one. GITHUB_TOKEN's budget of requests is shared with
      # the checks of pull requests, which anyone can open: spent, the build
      # stops, and deploys nothing, new blocks included.
      - run: |
          if [ "$OWN_TOKEN" != true ]; then
            echo "::warning::PUBLISH_GITHUB_TOKEN is not set, so publishing shares GITHUB_TOKEN's request budget with pull request checks. See the README, Setting up the marketplace."
          fi
          node scripts/build.mjs --out dist
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          OWN_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN != '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # In a public repository, GitHub disables a scheduled workflow after 60
  # days without activity, and then nothing starts it, not even a push: a
  # quiet marketplace would stop publishing, blocks included, and a week
  # later every copy of Paperly would refuse its index as stale. Enabling it
  # again on every scheduled run keeps the count from running out.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
